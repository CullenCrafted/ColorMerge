name: Verify Color Merge

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check all application and test modules
        run: npm run check
      - name: Run regression and gameplay tests
        if: ${{ !cancelled() }}
        run: npm run test:all
      - name: Build web and server
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Install browser verification tools without changing the lockfile
        if: ${{ !cancelled() }}
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: Verify mobile viewport navigation
        if: ${{ !cancelled() }}
        run: npm run test:browser
